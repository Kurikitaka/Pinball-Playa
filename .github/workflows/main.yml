name: Crear APK

on:
  workflow_dispatch:      # boton "Run workflow" en la pestana Actions
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Forzar orientacion vertical
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: Copiar el juego al proyecto
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: pinball-playa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
